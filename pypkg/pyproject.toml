[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "quarcnonlinear"
version = "0.0.0.dev0"
description = "Python bindings to the QUARC Nonlinear C++ core"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Aaron D. Likens", email = "alikens@unomaha.edu" }]
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
wheel.packages = ["src/quarcnonlinear"]
cmake.build-type = "Release"
